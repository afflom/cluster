# greenboot on n2. The boot is declared successful only if the health
# predicate passes within 600s; on failure the previous ostree deployment is
# restored automatically and the node reboots into it (§13.3).
#
# The attempt count is what bounds the loop. A deadline without one is a
# node that rolls back, boots the previous deployment, and --- if that is
# also unhealthy for an unrelated reason --- keeps trying. Past 3 attempts
# the previous deployment stands and the alert is the operator's signal.

GREENBOOT_MAX_BOOT_ATTEMPTS=3
GREENBOOT_HEALTHCHECK_TIMEOUT=600
