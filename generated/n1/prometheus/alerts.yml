# @generated by `just render` from model/. Do not edit.
# R1: the model is the single source. A hand-edit here is the same class
# of error as a hand-edited CONFORMANCE.md, and check-render says so.
# Asserted by: CD-12, CD-13, CD-09

# The alerts §18 declares. Each carries the condition and the duration from
# model/policy.toml, so tuning one is a model change and a re-render rather
# than an edit on a node.
#
# There is no paging integration: this is a three-node lab cluster, and an
# alert that wakes someone is worse than a dashboard they check (§18).

groups:
  - name: cluster
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 300s
        labels: { severity: critical }
        annotations: { summary: "scrape failure" }
      - alert: FailedUnits
        expr: node_systemd_unit_state{state="failed"} > 0
        for: 300s
        labels: { severity: warning }
        annotations: { summary: "node_systemd_unit_state{state='failed'} > 0" }
      - alert: DigestDrift
        expr: cluster_booted_is_target == 0
        for: 86400s
        labels: { severity: warning }
        annotations: { summary: "booted digest != current :stable" }
      - alert: RolloutStalled
        expr: cluster_rollout_target_pending == 1 and changes(cluster_rollout_stage[6h]) == 0
        for: 21600s
        labels: { severity: critical }
        annotations: { summary: "rollout state unchanged with a target pending" }
      - alert: DrainBudgetExceeded
        expr: cluster_drain_budget_exceeded > 0
        labels: { severity: critical }
        annotations: { summary: "any drain budget breached" }
      - alert: DigestQuarantined
        expr: cluster_quarantined_digests > 0
        labels: { severity: critical }
        annotations: { summary: "any node posted a quarantine" }
      - alert: SplitVersion
        expr: count(count by (booted) (cluster_booted_digest)) > 1 and 3 > 1
        for: 7200s
        labels: { severity: warning }
        annotations: { summary: "nodes on differing digests" }
      - alert: RootWritable
        expr: cluster_usr_read_only == 0
        labels: { severity: critical }
        annotations: { summary: "/usr is not read-only" }
      - alert: CachePressure
        expr: cluster_dmcache_occupancy_ratio > 0.9
        for: 900s
        labels: { severity: warning }
        annotations: { summary: "dm-cache occupancy > 90%" }
      - alert: DiskHealth
        expr: node_smart_healthy == 0
        labels: { severity: critical }
        annotations: { summary: "SMART failure" }
      - alert: Clock
        expr: node_timex_sync_status == 0 or abs(node_timex_offset_seconds) > 0.1
        for: 600s
        labels: { severity: warning }
        annotations: { summary: "chrony unsynchronised or offset > 100ms" }
      - alert: BenchContention
        expr: cluster_isolated_cpu_foreign_tasks > 0
        for: 60s
        labels: { severity: warning }
        annotations: { summary: "a process on n3's isolated CPUs that is not the measurement job" }
      - alert: ReclaimVolume
        expr: cluster_reclaim_archived_total > 5
        labels: { severity: warning }
        annotations: { summary: "more than 5 sessions archived in one run" }
      - alert: DirtyArchivesHeld
        expr: cluster_dirty_archives_held
        labels: { severity: info }
        annotations: { summary: "count of held dirty archives" }
