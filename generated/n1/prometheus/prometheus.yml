# Scrape configuration for n1. Every target is a mesh loopback: the metrics
# path crosses the mesh, not the management plane, so a scrape does not
# depend on the LAN being up (§18).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["10.10.255.1:9093"]

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["10.10.255.1:9100"]
        labels: { node: "n1", role: "storage-ci" }
      - targets: ["10.10.255.2:9100"]
        labels: { node: "n2", role: "compute" }
      - targets: ["10.10.255.3:9100"]
        labels: { node: "n3", role: "bench" }

  - job_name: cluster-health
    metrics_path: /health
    static_configs:
      - targets: ["10.10.255.1:9101"]
        labels: { node: "n1" }
      - targets: ["10.10.255.2:9101"]
        labels: { node: "n2" }
      - targets: ["10.10.255.3:9101"]
        labels: { node: "n3" }
