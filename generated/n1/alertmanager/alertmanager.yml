# Alertmanager on the storage node. Delivery is a Tailscale-reachable
# webhook: this is a three-node lab cluster, and an alert that wakes someone
# is worse than a dashboard they check (§18).

route:
  receiver: webhook
  group_by: [alertname, node]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: webhook
    webhook_configs:
      - url: "https://n1.afflom.ts.net/alerts"
        send_resolved: true
