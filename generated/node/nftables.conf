# The packet filter every node carries. Default drop on input; every accept
# is a declared rule in model/network.toml.
#
# One image boots all three roles, so this file is identical on all three
# machines. Rules true of one role only are in /run/cluster/nftables-role.conf,
# which cluster-init links into place once the role is known (§8.4).

flush ruleset

table inet cluster {
  set mesh {
    type ipv4_addr
    comment "every link address and loopback the ordinals derive (§4.1)"
    elements = { 10.10.0.0, 10.10.0.1, 10.10.0.2, 10.10.0.3, 10.10.0.4, 10.10.0.5, 10.10.255.1, 10.10.255.2, 10.10.255.3 }
  }

  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop

    # SSH from the LAN
    ip saddr 192.168.20.0/24 tcp dport 22 accept
    # node_exporter scrape
    ip saddr 192.168.20.0/24 tcp dport 9100 accept
    # echo request
    ip saddr 192.168.20.0/24 icmp type echo-request accept
    # peer discovery, IPv6 link-local multicast on a mesh port (§3.3)
    ip6 saddr fe80::/10 udp dport 4790 accept
    # SSH off-LAN
    iifname "tailscale0" tcp dport 22 accept
    # the mesh is a closed segment; all traffic between link and loopback addresses
    ip saddr @mesh accept
    # loopback
    iif lo accept

    # Whatever this machine's role adds, and nothing if it adds none.
    include "/run/cluster/nftables-role.conf"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    ct state established,related accept
    # Transit for §4.2's failover path, and nothing else: both ends must be
    # mesh addresses, so this forwards no traffic that arrived from the LAN.
    ip saddr @mesh ip daddr @mesh accept
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
