# Key-only SSH. A password-accepting sshd on a node that reboots
# unattended is an invitation, and there is no operator present to notice
# (§8.1).
#
# Rendered rather than written into the Containerfile: the model declares
# these, and a build that also declared them would give one decision two
# sources --- with the failure being an sshd that accepts passwords under a
# model that says it does not.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password

# Where an enrolled key lands, and therefore where sshd looks (§12.2).
#
# sshd's default is `.ssh/authorized_keys` and nothing else. Without this
# line the key an operator enters through the browser goes somewhere sshd
# never reads: the page says it was given and SSH still refuses --- a total
# and silent failure of the way back in §16.5 keeps for when the control
# plane is the thing that is wrong.
#
# The default is kept alongside it, so a key placed the ordinary way still
# works.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
