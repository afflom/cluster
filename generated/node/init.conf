# What a node needs to configure itself, and nothing it can work out
# for itself (§3.1, §3.3, §4.1).
#
# Read by cluster-init at boot. It is here rather than compiled into
# the binary because the binary is built once and the model changes: a
# route metric that lived in both would drift in the copy nobody read.

# How a port is sorted into a class. Read against the driver's
# *supported* link modes, never the negotiated speed: a mesh port is
# down exactly when the peer it waits for has not booted (§3.1).
mesh_min_speed_mbps=10000
mesh_count=2
mesh_mtu=9000
lan_min_speed_mbps=1000
lan_count=1
lan_mtu=1500
lan_addressing=dhcp

# The arithmetic turning an ordinal into an address (§4.1). Both ends
# of a cable compute the same link from the same two ordinals, and the
# lower ordinal takes the even address.
fleet_size=3
loopback_base=10.10.255.0
loopback_prefix_len=32
link_base=10.10.0.0
link_prefix_len=31

# Failover with no daemon: networkd withdraws the direct route on
# carrier loss and the transit route takes over at one more hop (§4.2).
direct_metric=100
transit_metric=200

# Learning which peer is on the far end of a given cable (§3.3).
discovery_group=ff02::1
discovery_port=4790
discovery_interval_ms=500
discovery_timeout_s=300

# Where a node reads its own stable identifier, before it has an
# ordinal (§2.3.2). Not derived from any MAC.
machine_id_path=/etc/machine-id
bulk_disk_min_gb=1000

# The cluster's names (§4.3).
domain=devcluster
name_template=node{ordinal}.{domain}
entry_name=devcluster
hosts_path=/etc/hosts
hosts_staging_path=/run/cluster/hosts.new

# Which role takes which ordinal, and which are handed out in what
# order (§2.3). `detect` is `bulk-disk` for the one role a machine
# works out for itself and `assigned` for the rest.
role=storage:bulk-disk:1:-:3
role=compute:assigned:-:1:2
role=testbed:assigned:-:2:1
