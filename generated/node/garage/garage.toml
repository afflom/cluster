# The object store on node1. It replaces `actions/cache`'s WAN round-trips
# with a mesh-local S3, which is why it binds the loopback and not the
# management plane (§5.4).
#
# replication_mode = "none": there is one node with the disk. §5.6 records
# that lv_data is a single copy, and a replication factor that pretended
# otherwise would be a claim this cluster cannot keep.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_mode = "none"

rpc_bind_addr = "10.10.255.1:3901"
rpc_public_addr = "10.10.255.1:3901"

[s3_api]
api_bind_addr = "10.10.255.1:3900"
s3_region = "cluster"

[admin]
api_bind_addr = "10.10.255.1:3903"
