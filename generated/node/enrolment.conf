# What an operator enters after the cluster boots, and where each value
# lands (§12.2).
#
# None of these is in this repository and none is in the image. They
# reach a node once, through the browser client over the LAN, authorized
# by the GitHub App device flow --- the one credential that can be checked
# without any of the others existing (§16.2).
#
# They were `@@PLACEHOLDER@@` names in the kickstart, substituted at ISO
# build time from Actions secrets that did not exist. A node would have
# installed the literal string as its authorized key and died at
# `tailscale up --erroronfail`. And an ISO is a release artifact: a secret
# put in one is published to whoever downloads it (§9.1).
#
# id:path:mode:apply:format --- an empty path means the value is spent
# by applying it and deliberately not kept.
#
# `format` is how the entered value becomes the file, which is not the
# same question as where the file goes. `raw` means the value is the
# file. `docker-auth@<registry>` means the value is a password in a
# containers-auth document keyed by that registry --- podman parses
# that file as JSON, and a bare token written there fails every pull
# (§13, CD-21).

# ssh_authorized_key --- The operator's SSH public key. Without it: SSH, which §16.5 keeps as the way back in when the control plane is the thing that is wrong stays down.
secret=ssh_authorized_key:/etc/ssh/authorized_keys.d/root:0644:none:raw
# registry_pull_token --- A GHCR token with read:packages and nothing else. Without it: pulling the images §13 applies unattended stays down.
secret=registry_pull_token:/etc/containers/auth.json:0600:none:docker-auth@ghcr.io
# runner_registration_pat --- A GitHub token with administration:write on this repository. Without it: the self-hosted runners, which are what T2 and the browser client's node-served mirror both wait on (§9.5, §16.3) stays down.
secret=runner_registration_pat:/etc/cluster/runner.pat:0600:none:raw
# tailnet_auth_key --- A Tailscale auth key, ephemeral and single-use. Without it: off-LAN access, and the tailnet the control plane is published on (§4.5, §16.2) stays down.
secret=tailnet_auth_key::0600:tailscale-up:raw
