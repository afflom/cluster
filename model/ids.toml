#
# This is R1 applied to infrastructure rather than to documentation. Each row
# below is checked by `cargo xtask check-render`, which reads the committed
# `generated/` tree and the register together: an artifact nothing asserts about
# and a claim that touches no artifact both fail.
# ---------------------------------------------------------------------------

[[id]]
id = "CD-01"
level = "build"
suite = "definition"
tier = "T0"
statement = """
Every rendered network unit for a physical interface matches its card by MAC
address rather than by kernel name, and every MAC the model declares appears in
exactly one unit.
"""

[[id]]
id = "CD-02"
level = "build"
suite = "definition"
tier = "T0"
statement = """
Every node renders a direct route to each peer loopback at the declared metric
and a transit route to it, at the higher metric, via the remaining peer.
"""

[[id]]
id = "CD-03"
level = "build"
suite = "definition"
tier = "T0"
statement = """
The rendered firewall drops input by default, accepts only the flows the model
declares, and forwards only between declared mesh addresses.
"""

[[id]]
id = "CD-04"
level = "build"
suite = "definition"
tier = "T0"
statement = """
The rendered hosts file resolves every node's mesh name and management name to
the addresses the model declares, and adds no name the model does not.
"""

[[id]]
id = "CD-05"
level = "build"
suite = "definition"
tier = "T0"
statement = """
Every rendered Quadlet volume mount carries the SELinux relabel flag its model
row declares.
"""

[[id]]
id = "CD-06"
level = "build"
suite = "definition"
tier = "T0"
statement = """
The rendered kernel arguments carry the base set on every node and the declared
isolation set on the measurement node alone.
"""

[[id]]
id = "CD-07"
level = "build"
suite = "definition"
tier = "T0"
statement = """
The rendered kickstart partitions the boot device as the model declares and
contains no secret value, only the named placeholders the installer substitutes.
"""

[[id]]
id = "CD-08"
level = "build"
suite = "definition"
tier = "T0"
statement = """
The rendered updater, health, garbage-collection and reclamation units carry the
intervals, deadlines and budgets model/policy.toml declares, and the updater's
environment carries this node's rollout position and every peer's health
endpoint.
"""

[[id]]
id = "CD-09"
level = "build"
suite = "definition"
tier = "T0"
statement = """
The committed generated tree equals what the model renders, contains no file the
model does not render, and every file whose format admits a comment names a
