"""

[[id]]
id = "CD-11"
level = "build"
suite = "definition"
tier = "T0"
statement = """
The rendered container signature policy and registry configuration carry the
issuer, identity, mirrors and fallbacks the model declares, and every address in
a rendered artifact is substituted from the node table rather than written twice.
