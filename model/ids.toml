[[id]]
id = "CD-12"
level = "build"
suite = "definition"
tier = "T0"
statement = """
Every rendered artifact is copied into an image by some build, every executable a
rendered unit invokes is produced by a build or a declared package, every
container image the model names in this repository's namespace has a
Containerfile, every configuration a unit mounts read-only is rendered, and every
