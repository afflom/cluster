# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The classes are declared in `SPEC.md` §19.2. This file holds the rows; the
# statements are the register's words and the scenarios copy them.

spec = "cluster/1"

# ---------------------------------------------------------------------------
# CM- --- Model. The register is internally consistent.
#
# CM-01 .. CM-03 are the template's own gates. They had no rows there because
# the register was empty and no ID's prefix was `CM`, so nothing looked for
# them; adding CM-04 made `CM` a known prefix and the meta-gate found the gap
# immediately --- which is the anti-vacuity design working, a little late.
#
# CM-04 is this repository's: a register-consistency property, because "a
# hardware claim cannot be discharged by a simulated run" is a statement about
# what the register permits rather than about any node.
# ---------------------------------------------------------------------------

[[id]]
id = "CM-01"
level = "build"
suite = "model"
tier = "T0"
statement = """
The model is self-consistent, every file under model/ carries the schema tag
this build understands, and CONFORMANCE.md equals what the register renders.
"""

[[id]]
id = "CM-02"
level = "build"
suite = "model"
tier = "T0"
statement = """
Every registered ID has a scenario and a test whose name ends in it, every
scenario and every test names a registered ID, no scenario has a pending step,
and the meta-gate itself can be made to fail.
"""

[[id]]
id = "CM-03"
level = "build"
suite = "model"
tier = "T0"
statement = """
Every some-true claim cites an authority that exists, with a citation and either
a checksum over a committed artifact or a stated reason there is none.
"""

[[id]]
id = "CM-04"
level = "build"
suite = "model"
tier = "T0"
statement = """
Every registered claim is collected by exactly one validation tier, and no
simulated tier collects a hardware claim, so a claim about a physical machine
can never be discharged by a guest.
"""

# ---------------------------------------------------------------------------
