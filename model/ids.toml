"""

[[id]]
id = "CD-15"
level = "build"
suite = "definition"
tier = "T0"
statement = """
The control plane is published on the tailnet by a rendered unit, and the tailnet
access policy is rendered from the model's authorized logins and management
prefix, advertising no mesh address.
"""

[[id]]
id = "CD-16"
level = "build"
suite = "definition"
tier = "T0"
statement = """
Every rendered artifact is valid in its own syntax: a JSON document parses and
carries only the keys its schema defines, an interpreted script carries its
