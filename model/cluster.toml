# model/cluster.toml --- what a *fleet* is (SPEC.md §2, §3.1, §4.1, §16.2).
#
# What this file does not contain is the point of it.
#
# There are no MAC addresses, no per-machine IP addresses, and no table saying
# which chassis is which. An earlier revision had all three: four MACs per node,
# a static management address each, and a `role` column naming the machine that
# held it. Every one of those made replacing a mainboard an edit to a file in a
# repository, and every one of them was a fact about a machine kept somewhere
# the machine could not see (§3.1, §17.1).
#
# What is declared here is the *shape* of a conforming fleet and the arithmetic
# that turns an ordinal into an address. A machine discovers its own hardware,
# is assigned an ordinal by the registrar, and derives everything else. The
# renderer can still emit a complete firewall and a complete scrape list,
# because ordinals 1..=size are known even though which machine holds each is
# not (§4.1).

spec = "cluster/1"

# The cluster's DNS-style domain, and the bare name that is its entry point
# (§4.3). `devcluster` resolves to the storage node, where the control plane
# answers; `node1.devcluster` .. `node3.devcluster` resolve to the ordinals.
domain = "devcluster"

# The tailnet the control plane and off-LAN access are published on (§4.5, §16.2).
tailnet = "afflom"

# Tailscale's MagicDNS suffix. A client reaches a node at
# `<name>.<tailnet>.<magic_dns_suffix>` and this is the only stable way to reach
# one: management addresses come from DHCP (§3.2), so there is no address to put
# in an ssh_config. It is a model fact rather than a literal in the renderer
# because it is Tailscale's, not this repository's, and a tailnet on a different
# suffix would silently render an unreachable host.
magic_dns_suffix = "ts.net"

# Who may drive the cluster (§16.2).
#
# Authorization is a login compared against this list. `afflom` is a *user*
# account, not an organization, so there is no membership API to call --- no
# `GET /orgs/afflom/members` exists. A second person needs either an
# organization or a collaborator check against a named repository, and neither
# is in scope. Stating the limit here is what keeps it from being foreclosed by
# silence.
#
# These are GitHub logins, not email addresses: the identity is whatever
# `GET /user` returns for the bearer token.
authorized_logins = ["afflom"]

# ---------------------------------------------------------------------------
# The fleet (§2.3, §4.1)
# ---------------------------------------------------------------------------

[fleet]
# Ordinals run 1..=size. Three is structural, not a preference: the mesh gives
# each node one 10GbE port per peer and each board has two (§1.1).
size = 3
# How an ordinal becomes a name. `{ordinal}` and `{domain}` are the only
# substitutions, and `CD-04` asserts the rendered names match.
name_template = "node{ordinal}.{domain}"
# The bare cluster name, resolving to whichever ordinal holds `storage`.
entry_name = "devcluster"

# How a machine identifies itself before it has an ordinal (§2.3.2).
#
# `/etc/machine-id` is generated by systemd on first boot and lives in `/etc`,
# which is writable state on a bootc host, so it survives every update and every
# rollback. It is not derived from a MAC and does not change when a card does.
[identity]
source = "/etc/machine-id"

# ---------------------------------------------------------------------------
# Roles (§2.3)
#
# `storage` is self-detected from the machine's own disks. The other two are
# assigned by the registrar in the order machines register, which is the only
# tie-break available between two identical machines.
# ---------------------------------------------------------------------------

# A non-boot block device at or above this is bulk storage, and the machine
# holding one is the storage node (§2.3.1). The threshold sits far above the
# 256 GB container-graph SSDs and far below the 2 TB bulk device, so on a
# conforming fleet it is true on exactly one machine. On any other count the
# registrar refuses rather than choosing (§21.11).
[detection]
bulk_disk_min_gb = 1000

[[role]]
id = "storage"
# The registrar is ordinal 1 by construction: it is the one machine that does
# not have to ask, so it cannot be assigned.
ordinal = 1
# Last to update, because it carries the machinery needed to diagnose a bad
# one (§2.3).
update_position = 3
detect = "bulk-disk"
runs = "registry, object store, NFS, observability, control plane, registrar, CI runners, T2 host"
# The storage node must not compete for inrush after an outage, and the other
# two should find the registry and NFS already answering (§2.5).
power_on_delay_s = 30

[role.devices]
# §2.2: both SATA devices are internal and the SSD caches the HDD. The fallback
# --- if the chassis will not take both --- is `m2-partition`, and that is the
# whole of the change. Nothing downstream branches.
cache_device = "sata-ssd"
cache_partition_gib = 64
volume_group = "vg_data"
origin_lv = "lv_data"

[[role]]
id = "compute"
# Assigned to the first machine to register (§2.3.2).
assign_order = 1
update_position = 2
detect = "assigned"
runs = "devcontainers, VS Code Remote-SSH target"
power_on_delay_s = 0

[role.devices]
# `overlay2` and podman's `overlay` driver do not function on NFS, so the
# container graph is local on every node and NFS carries data only (§11.2).
container_graph_device = "sata-ssd"

[[role]]
id = "testbed"
# Assigned to the second machine to register (§2.3.2).
assign_order = 2
# First to update, because a failure there costs a measurement window rather
# than the pipeline (§2.3).
update_position = 1
detect = "assigned"
runs = "one measurement job at a time, nothing else"
power_on_delay_s = 0

[role.devices]
bench_device = "sata-ssd"

# ---------------------------------------------------------------------------
# Hardware profile (§2.1). Uniform across the fleet, so it is declared once.
#
# This is a statement about what a conforming machine *is*, not about which
# machine is which. `CH-` verifies it against a real node; nothing derives an
# identity from it.
# ---------------------------------------------------------------------------

[profile]
id = "e300-8d"
chassis = "Supermicro SYS-E300-8D"
board = "X10SDV-4C-TLN2F"
cpu = "Intel Xeon D-1518"
cores = 4
threads = 8
base_mhz = 2200
# Equal to `base_mhz` on this part, and that is the reason a machine built on it
# is usable as a measurement host: a flat clock has no boost algorithm to
# introduce variance.
max_mhz = 2200
tdp_watts = 35
# Bounds what any measurement taken on this fleet generalizes to (§2.1).
avx512 = false
memory_gb = 32
memory_slots = 4
memory_ceiling_gb = 128
# What §3.1's classifier must find. Two mesh-class ports and at least one
# LAN-class port, or the machine is misassembled and the boot fails.
nic_10g = 2
nic_1g = 2
ipmi = true

# The devices a conforming machine may carry. `purpose` is what the device is
# *for* when a role needs it, not a claim that every machine has one: only the
# storage node carries `sata-hdd`, and that is precisely what §2.3.1 detects.
[[disk]]
id = "m2"
kind = "nvme"
size_gb = 256
purpose = "boot"

[[disk]]
id = "sata-ssd"
kind = "ssd"
size_gb = 256
purpose = "cache, container graph, or bench, depending on role"

[[disk]]
id = "sata-hdd"
kind = "hdd"
size_gb = 2000
purpose = "bulk data; present only on the storage node"

# ---------------------------------------------------------------------------
# Disk layout, identical on every M.2 (§5.1). bootc uses ostree deployments
# rather than A/B partitions, so there is no slot arithmetic here: current and
# rollback share `p3`.
# ---------------------------------------------------------------------------

[[partition]]
id = "p1"
size = "1GiB"
format = "vfat"
mount = "/boot/efi"

[[partition]]
id = "p2"
size = "1GiB"
format = "xfs"
mount = "/boot"

[[partition]]
id = "p3"
size = "remainder"
format = "xfs"
mount = "/"

# ---------------------------------------------------------------------------
# The GitHub App the browser authorizes against (§16.2).
#
# The client ID is **public by design** and is deliberately not in §12.2's table
# of secrets. The device flow uses a public client ID with no client secret,
# which is exactly what lets a static page start an authorization at all --- and
# a table of secrets containing a non-secret teaches its reader to skim.
#
# A GitHub *App*, not an OAuth App: App user-to-server tokens expire in eight
# hours and carry a refresh token, where an OAuth App token does not expire, and
# a non-expiring token in browser storage is a permanent liability.
# ---------------------------------------------------------------------------

[github_app]
client_id = "Iv23liCLUSTERafflom00"
# Identity only. It deliberately does not request `repo`: the UI takes a typed
# repository reference, and the container clones with credentials that arrive
# over the tunnel and die with the connection (§16.2).
scopes = ["read:user"]
device_code_url = "https://github.com/login/device/code"
token_url = "https://github.com/login/oauth/access_token"
user_url = "https://api.github.com/user"

# ---------------------------------------------------------------------------
# Firmware (§2.4). This pipeline cannot reach these; they are applied by hand at
# bootstrap and re-verified by `CH-01` on every hardware smoke run. Declaring
# them here is what makes "re-verified" mean something: the check reads the
# model rather than an operator's memory.
# ---------------------------------------------------------------------------

[[firmware]]
setting = "Intel VT-x"
value = "Enabled"
probe = "cpuinfo:vmx"
reason = "the storage node runs T2 guests; without it QEMU falls back to TCG"

[[firmware]]
setting = "Intel VT-d"
value = "Enabled"
probe = "cpuinfo:iommu"
reason = "required for device assignment; harmless otherwise"

[[firmware]]
setting = "Hyper-Threading"
value = "Enabled"
probe = "cpuinfo:siblings"
reason = "the testbed disables SMT via nosmt, so isolation is expressed in one place"

[[firmware]]
setting = "C-States"
value = "Enabled"
probe = "ipmi:bios"
reason = "the testbed constrains them on the kernel cmdline; BIOS stays permissive so control lives in the model"

[[firmware]]
setting = "Restore on AC Power Loss"
value = "Power On"
probe = "ipmi:chassis-policy"
reason = "headless cluster, no operator after an outage"

[[firmware]]
setting = "Boot order"
value = "M.2 first, then virtual media"
probe = "ipmi:bootparam"
reason = "virtual media is the recovery path and must not be the default"

[[firmware]]
setting = "Console Redirection"
value = "COM2/SOL, 115200 8N1"
probe = "ipmi:sol"
reason = "matches console=ttyS1,115200 in the image kargs"

[[firmware]]
setting = "Watchdog"
value = "Enabled, reset action"
probe = "ipmi:watchdog"
reason = "a hung node recovers without an operator, which unattended update requires"
