# Build once, validate that digest, promote that digest (SPEC.md §9.2).
#
# The images are built here and never rebuilt between validation and
# publication. Every downstream job takes the digest this job captured, so a
# tier can never validate something other than what would be promoted.
name: images
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # T2 nightly as well as per-PR (§10.2).
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      n1: ${{ steps.push.outputs.n1 }}
      n2: ${{ steps.push.outputs.n2 }}
      n3: ${{ steps.push.outputs.n3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Hosted runners provide roughly 14 GB free, which does not hold three
      # bootc disk images plus a toolchain (§9.4).
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Build the node binaries
        run: |
          cargo build --release \
            -p cluster-health -p cluster-updater -p cluster-ctl -p devcontainer-agent
          cp target/release/cluster-health target/release/cluster-updater \
             target/release/cluster-ctl target/release/devcontainer-agent .

      - uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push, capturing each digest
        run: |
          set -euo pipefail
          for node in n1 n2 n3; do
            # §8.1 puts the rendered networkd and hosts files in the base, so the
            # base is built per node. The variant then layers its own delta.
            podman build --platform linux/amd64 --build-arg NODE="$node" \
              -f images/base/Containerfile -t "cluster-base-$node" .
            podman build --platform linux/amd64 --build-arg BASE="localhost/cluster-base-$node" \
              -f "images/$node/Containerfile" \
              -t "ghcr.io/${{ github.repository }}/$node:ci-${{ github.sha }}" .
            # Retry with backoff. GHCR answers a secondary rate limit as a 403
            # whose *body* says to wait and try again --- the surface looks like
            # a permission failure and is not one, which cost an hour to find.
            # Three images of a few hundred megabytes each, pushed back to back,
            # reach that limit on a repository with any push activity.
            #
            # GitHub's own guidance for a secondary limit is to wait and retry,
            # so that is what this does rather than failing a build over a
            # throttle.
            pushed=false
            for attempt in 1 2 3 4 5; do
              # `--digestfile` records the digest of what the *registry* now
              # holds. `podman inspect .Digest` gives the local manifest's
              # digest, which is not the same value and is not resolvable by a
              # puller --- that mismatch is what made the tiers ask for a
              # manifest ghcr.io had never heard of.
              if podman push --digestfile "/tmp/$node.digest" \
                   "ghcr.io/${{ github.repository }}/$node:ci-${{ github.sha }}"; then
                pushed=true
                break
              fi
              delay=$(( attempt * 30 ))
              echo "::warning title=Push retry::$node push attempt $attempt failed;" \
                   "waiting ${delay}s. A 403 from ghcr.io is usually a secondary" \
                   "rate limit rather than a permission problem."
              sleep "$delay"
            done
            if [ "$pushed" != true ]; then
              echo "::error::$node could not be pushed after 5 attempts." >&2
              exit 1
            fi
            digest=$(cat "/tmp/$node.digest")
            # Confirm the registry can actually resolve it before anything
            # downstream is told to boot it. §9.2 promotes *that digest*, so a
            # digest nothing can pull is a validation that would silently be
            # about a different artifact.
            skopeo inspect --raw \
              "docker://ghcr.io/${{ github.repository }}/$node@$digest" >/dev/null
            echo "$node=$digest" >> "$GITHUB_OUTPUT"
            # A pause between images. The limit is on the rate, and three
            # back-to-back pushes are what reaches it; this costs a minute and
            # removes the usual cause of the retries above.
            sleep 20
          done

  t1:
    # One node boots under OVMF and the health predicate passes (§10.2).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install the guest tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf

      - name: Build the disk the tier boots
        run: |
          set -euo pipefail
          mkdir -p target/harness

          # By digest, not by tag. §9.2: build once, validate *that digest*,
          # promote that digest --- a tag could have moved between the push and
          # here, and then the tier would validate something else.
          image="ghcr.io/${{ github.repository }}/n3@${{ needs.build.outputs.n3 }}"

          # bootc-image-builder reads root's container storage and no longer
          # pulls anything itself, so the image has to be in *root's* storage
          # before it runs --- a login as the runner user is not enough.
          sudo podman login ghcr.io \
            -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'
          sudo podman pull "$image"

          # It turns the container into a disk. The tier boots that, not a
          # hand-made image, so what T1 asserts over is the artifact the fleet
          # would install.
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v ./target/harness:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 "$image"
          sudo mv target/harness/qcow2/disk.qcow2 target/harness/base.qcow2
          sudo chown "$USER" target/harness/base.qcow2

      # GitHub documents nested virtualization on hosted runners as possible but
      # not supported, and /dev/kvm availability is reported as inconsistent
      # (§9.4). The harness reports absence as an explicit skip with exit 3 and
      # never falls back to TCG. T1 may therefore skip --- and a skip is recorded
      # as a skip here, not swallowed: T2 runs where KVM is guaranteed, so
      # nothing is promoted on a skipped tier.
      - name: T1
        run: |
          set +e
          just t1
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "::notice title=T1 skipped::No /dev/kvm on this runner; nothing was tested. T2 covers it."
            exit 0
          fi
          exit "$code"
        env:
          CLUSTER_TARGET_DIGEST: ${{ needs.build.outputs.n3 }}
          CLUSTER_OVMF: /usr/share/OVMF/OVMF_CODE.fd

  t2:
    # Three nodes, mesh wired, failover, and a full simulated rollout with drain
    # and rollback. Self-hosted on n1: real KVM, 2 TB of disk, no emulation tax.
    #
    # Not circular: n1 runs the *previously promoted* image while validating the
    # candidate in guests (§9.4).
    #
    # Gated on the fleet existing. Until a node is registered as a runner there
    # is nothing to schedule this on, and a job queued against a runner that
    # does not exist blocks the workflow for ever rather than reporting
    # anything. `t2-outcome` below always runs and says which happened, so an
    # absent tier is announced rather than assumed --- the same discipline §9.4
    # applies to a missing /dev/kvm.
    #
    # Nothing is promoted on a skipped tier: `promote.yml` refuses a commit
    # whose T2 did not succeed, so this gate cannot become a way past T2.
    needs: build
    # Never for a fork. §9.1 derives "T2 may run on n1" from fork pull requests
    # not existing, which was true only while the repository was private. It is
    # public, so a fork's pull request would otherwise schedule that fork's code
    # on a node holding the registry, the object store and every devcontainer.
    #
    # This is a guard, not the fix. §9.1's precondition does not hold and the
    # specification says so (§21.10): either the repository goes private again,
    # or T2 moves to hosted runners.
    if: >-
      vars.CLUSTER_FLEET_ONLINE == 'true'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, cluster, ci]
    steps:
      - uses: actions/checkout@v4

      - name: Build the disk the tier boots
        run: |
          set -euo pipefail
          mkdir -p target/harness
          image="ghcr.io/${{ github.repository }}/n1@${{ needs.build.outputs.n1 }}"
          sudo podman login ghcr.io \
            -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'
          sudo podman pull "$image"
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v ./target/harness:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 "$image"
          sudo mv target/harness/qcow2/disk.qcow2 target/harness/base.qcow2

      - name: Build an unsigned image, for the claim that it is refused
        run: |
          set -euo pipefail
          # In this repository's own namespace, so the reference looks exactly
          # like one the node would accept and only the signature distinguishes
          # it. A foreign reference would prove nothing (§12.3).
          podman tag "ghcr.io/${{ github.repository }}/n3:ci-${{ github.sha }}" \
            "ghcr.io/${{ github.repository }}/n3:unsigned-${{ github.sha }}"
          podman push "ghcr.io/${{ github.repository }}/n3:unsigned-${{ github.sha }}"

      # No skip path. On n1 KVM is guaranteed, so its absence means the node is
      # broken rather than the harness being portable --- and treating that as a
      # skip would let a broken CI host promote images (§9.4).
      - run: just t2
        env:
          CLUSTER_TARGET_DIGEST: ${{ needs.build.outputs.n1 }}
          CLUSTER_PREVIOUS_STABLE: ghcr.io/${{ github.repository }}/n1:stable
          CLUSTER_UNSIGNED_IMAGE: ghcr.io/${{ github.repository }}/n3:unsigned-${{ github.sha }}

  # Whether T2 ran, said out loud. A tier that quietly did not run is the
  # vacuous gate in its most convincing disguise (§9.4).
  t2-outcome:
    needs: [build, t2]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report the tier's outcome
        run: |
          set -euo pipefail
          case "${{ needs.t2.result }}" in
            success)
              echo "T2 ran and passed." ;;
            skipped)
              echo "::notice title=T2 did not run::The fleet is not registered as a \
              runner, so nothing was tested at T2. Set the CLUSTER_FLEET_ONLINE \
              repository variable once n1 has a runner. Promotion refuses a commit \
              whose T2 did not succeed, so nothing can be promoted on this (SPEC.md \
              §9.4, §22)."
              ;;
            *)
              echo "::error title=T2 failed::T2 ran and did not pass." >&2
              exit 1 ;;
          esac
