# Build once, validate that digest, promote that digest (SPEC.md §9.2).
#
# The images are built here and never rebuilt between validation and
# publication. Every downstream job takes the digest this job captured, so a
# tier can never validate something other than what would be promoted.
name: images
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # T2 nightly as well as per-PR (§10.2).
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.push.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Hosted runners provide roughly 14 GB free, which does not hold a bootc
      # disk image plus a toolchain without help (§9.4).
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Build the node binaries
        run: |
          cargo build --release \
            -p cluster-health -p cluster-updater -p cluster-ctl \
            -p devcontainer-agent -p cluster-init
          cp target/release/cluster-health target/release/cluster-updater \
             target/release/cluster-ctl target/release/devcontainer-agent \
             target/release/cluster-init .

      - uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push, capturing the digest
        run: |
          set -euo pipefail
          node=node
          # One image (§8.4). There were three, differing only in which units
          # they enabled, and the loop that built them is gone with them --- as
          # is the rate limit three back-to-back pushes used to reach.
          podman build --platform linux/amd64 \
            -f images/node/Containerfile \
            -t "ghcr.io/${{ github.repository }}/$node:ci-${{ github.sha }}" .

          # Retry with backoff. GHCR answers a secondary rate limit as a 403
          # whose *body* says to wait and try again --- the surface looks like a
          # permission failure and is not one, which cost an hour to find.
          #
          # GitHub's own guidance for a secondary limit is to wait and retry, so
          # that is what this does rather than failing a build over a throttle.
          pushed=false
          for attempt in 1 2 3 4 5; do
            # `--digestfile` records the digest of what the *registry* now holds.
            # `podman inspect .Digest` gives the local manifest's digest, which
            # is not the same value and is not resolvable by a puller --- that
            # mismatch is what made the tiers ask for a manifest ghcr.io had
            # never heard of.
            if podman push --digestfile "/tmp/$node.digest" \
                 "ghcr.io/${{ github.repository }}/$node:ci-${{ github.sha }}"; then
              pushed=true
              break
            fi
            delay=$(( attempt * 30 ))
            echo "::warning title=Push retry::push attempt $attempt failed;" \
                 "waiting ${delay}s. A 403 from ghcr.io is usually a secondary" \
                 "rate limit rather than a permission problem."
            sleep "$delay"
          done
          if [ "$pushed" != true ]; then
            echo "::error::the image could not be pushed after 5 attempts." >&2
            exit 1
          fi
          digest=$(cat "/tmp/$node.digest")
          # Confirm the registry can actually resolve it before anything
          # downstream is told to boot it. §9.2 promotes *that digest*, so a
          # digest nothing can pull is a validation that would silently be about
          # a different artifact.
          skopeo inspect --raw \
            "docker://ghcr.io/${{ github.repository }}/$node@$digest" >/dev/null
          echo "node=$digest" >> "$GITHUB_OUTPUT"

  t1:
    # One node boots under OVMF and the health predicate passes (§10.2).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # One image carries every role's packages (§8.4, §21.14), so it is around
      # 5 GB where the per-node images were about 2. Pulling it and then writing
      # a disk image from it does not fit in the ~14 GB a hosted runner starts
      # with, and the failure surfaces as an opaque `no space left on device`
      # inside bootc-image-builder rather than as anything about size.
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Install the guest tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf

      - name: Build the disk the tier boots
        run: |
          set -euo pipefail
          mkdir -p target/harness

          # An ephemeral key, and the public half installed for root in the disk.
          #
          # A bootc image has no user and no key: root is locked, so a guest built
          # without this refuses every login and the tier reports `Connection
          # refused` for five minutes per test about a machine that booted
          # perfectly. The key opens one disk for one tier run and is thrown away
          # with the runner --- it is not a secret this repository holds (§12.2).
          ssh-keygen -t ed25519 -N '' -C 'cluster tier' -f target/harness/tier_key
          cat > target/harness/bib.toml <<EOF
          [[customizations.user]]
          name = "root"
          key = "$(cat target/harness/tier_key.pub)"
          EOF

          # By digest, not by tag. §9.2: build once, validate *that digest*,
          # promote that digest --- a tag could have moved between the push and
          # here, and then the tier would validate something else.
          image="ghcr.io/${{ github.repository }}/node@${{ needs.build.outputs.node }}"

          # bootc-image-builder reads root's container storage and no longer
          # pulls anything itself, so the image has to be in *root's* storage
          # before it runs --- a login as the runner user is not enough.
          sudo podman login ghcr.io \
            -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'
          sudo podman pull "$image"

          # It turns the container into a disk. The tier boots that, not a
          # hand-made image, so what T1 asserts over is the artifact the fleet
          # would install.
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v ./target/harness:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --config /output/bib.toml "$image"
          sudo mv target/harness/qcow2/disk.qcow2 target/harness/base.qcow2
          sudo chown "$USER" target/harness/base.qcow2

      # GitHub documents nested virtualization on hosted runners as possible but
      # not supported, and /dev/kvm availability is reported as inconsistent
      # (§9.4). The harness reports absence as an explicit skip with exit 3 and
      # never falls back to TCG. T1 may therefore skip --- and a skip is recorded
      # as a skip here, not swallowed: T2 runs where KVM is guaranteed, so
      # nothing is promoted on a skipped tier.
      - name: T1
        run: |
          set +e
          just t1
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "::notice title=T1 skipped::No /dev/kvm on this runner; nothing was tested. T2 covers it."
            exit 0
          fi
          exit "$code"
        env:
          CLUSTER_TARGET_DIGEST: ${{ needs.build.outputs.node }}
          # No firmware path here. The harness searches the places distributions
          # put OVMF, because pinning one meant T1 skipped on every hosted runner
          # --- and reported that /dev/kvm was absent when KVM was fine and only
          # the file had moved.

  t2:
    # Three nodes, mesh wired, failover, and a full simulated rollout with drain
    # and rollback. Self-hosted on the storage node: real KVM, 2 TB of disk, no
    # emulation tax.
    #
    # Not circular: it runs the *previously promoted* image while validating the
    # candidate in guests (§9.4).
    #
    # Gated on the fleet existing. Until a node is registered as a runner there
    # is nothing to schedule this on, and a job queued against a runner that
    # does not exist blocks the workflow for ever rather than reporting
    # anything. `t2-outcome` below always runs and says which happened, so an
    # absent tier is announced rather than assumed --- the same discipline §9.4
    # applies to a missing /dev/kvm.
    #
    # Nothing is promoted on a skipped tier: `promote.yml` refuses a commit
    # whose T2 did not succeed, so this gate cannot become a way past T2.
    needs: build
    # Never for a fork. §9.1 derives "T2 may run on the storage node" from fork PRs
    # not existing, which was true only while the repository was private. It is
    # public, so a fork's pull request would otherwise schedule that fork's code
    # on a node holding the registry, the object store and every devcontainer.
    #
    # This is a guard, not the fix. §9.1's precondition does not hold and the
    # specification says so (§21.10): either the repository goes private again,
    # or T2 moves to hosted runners.
    if: >-
      vars.CLUSTER_FLEET_ONLINE == 'true'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, cluster, ci]
    steps:
      - uses: actions/checkout@v4

      - name: Build the disk the tier boots
        run: |
          set -euo pipefail
          mkdir -p target/harness

          # The same ephemeral key the hosted tier uses, for the same reason: a
          # bootc image locks root and installs no key, so a guest built without
          # one refuses every login (§12.2).
          ssh-keygen -t ed25519 -N '' -C 'cluster tier' -f target/harness/tier_key
          cat > target/harness/bib.toml <<EOF
          [[customizations.user]]
          name = "root"
          key = "$(cat target/harness/tier_key.pub)"
          EOF

          image="ghcr.io/${{ github.repository }}/node@${{ needs.build.outputs.node }}"
          sudo podman login ghcr.io \
            -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'
          sudo podman pull "$image"
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v ./target/harness:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --config /output/bib.toml "$image"
          sudo mv target/harness/qcow2/disk.qcow2 target/harness/base.qcow2

      - name: Build an unsigned image, for the claim that it is refused
        run: |
          set -euo pipefail
          # In this repository's own namespace, so the reference looks exactly
          # like one the node would accept and only the signature distinguishes
          # it. A foreign reference would prove nothing (§12.3).
          podman tag "ghcr.io/${{ github.repository }}/node:ci-${{ github.sha }}" \
            "ghcr.io/${{ github.repository }}/node:unsigned-${{ github.sha }}"
          podman push "ghcr.io/${{ github.repository }}/node:unsigned-${{ github.sha }}"

      # No skip path. On the storage node KVM is guaranteed, so its absence means it is
      # broken rather than the harness being portable --- and treating that as a
      # skip would let a broken CI host promote images (§9.4).
      - run: just t2
        env:
          CLUSTER_TARGET_DIGEST: ${{ needs.build.outputs.node }}
          CLUSTER_PREVIOUS_STABLE: ghcr.io/${{ github.repository }}/node:stable
          CLUSTER_UNSIGNED_IMAGE: ghcr.io/${{ github.repository }}/node:unsigned-${{ github.sha }}

  # Whether T2 ran, said out loud. A tier that quietly did not run is the
  # vacuous gate in its most convincing disguise (§9.4).
  t2-outcome:
    needs: [build, t2]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report the tier's outcome
        run: |
          set -euo pipefail
          case "${{ needs.t2.result }}" in
            success)
              echo "T2 ran and passed." ;;
            skipped)
              echo "::notice title=T2 did not run::The fleet is not registered as a \
              runner, so nothing was tested at T2. Set the CLUSTER_FLEET_ONLINE \
              repository variable once the storage node has a runner. Promotion refuses a commit \
              whose T2 did not succeed, so nothing can be promoted on this (SPEC.md \
              §9.4, §22)."
              ;;
            *)
              echo "::error title=T2 failed::T2 ran and did not pass." >&2
              exit 1 ;;
          esac
