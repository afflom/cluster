# R2's behavioural half, run on its own so a failure names the rule rather than
# arriving buried in a longer job (SPEC.md AGENTS.md R2).
name: honesty
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  meta-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just bdd
