# The Pages UI (SPEC.md §16.3).
#
# Entirely static. Its only build-time configuration is the API base URL, from a
# repository variable; all state comes from cluster-ctl at runtime.
name: pages
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # Run from inside the crate. Given a path, trunk resolves the manifest
      # against the *current* directory's workspace, and this workspace root is
      # virtual --- it has no root package, so trunk reports it cannot find one.
      # `--release` also takes an optional value, so it must not precede a path.
      - run: trunk build --release
        working-directory: crates/cluster-web
        env:
          CLUSTER_API_BASE: ${{ vars.CLUSTER_API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/cluster-web/dist

  # Whether Pages is enabled on the repository. It is an owner-only setting that
  # no token available to a workflow can flip, so this asks rather than assumes:
  # `deploy-pages` answers 404 when it is off, and a workflow that treated that
  # as a build failure would report a settings page as broken code.
  #
  # Self-healing: enable Pages in Settings and the next run deploys. There is no
  # variable to remember to set afterwards.
  pages-enabled:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::GitHub Pages is off for this \
            repository, so the bundle was built and not published. Enable it at \
            Settings -> Pages with source 'GitHub Actions'; the next run deploys. \
            The storage-node mirror (SPEC.md §16.3) is unaffected and is the route that \
            always works."
          fi

  deploy:
    needs: [build, pages-enabled]
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

  # §16.3: the same bundle, served from the storage node at the API's origin.
  #
  # Same-origin has no preflight and no browser policy between a page and the
  # API it was built for --- which retires the whole Local Network Access risk
  # class, including the case where Chrome later reclassifies CGNAT or an
  # enterprise policy blocks the prompt. Pages stays canonical and stays the
  # versioned artifact; this is the route that always works.
  #
  # It ships *with* the Pages deployment rather than after it. A UI published to
  # Pages alone, pending a mirror to follow, is a UI whose one guaranteed route
  # does not exist yet (§22).
  mirror:
    needs: build
    # Gated on the fleet existing, for the reason images.yml's T2 is: a job
    # queued against a runner that does not exist blocks the workflow for ever.
    # Pages remains canonical either way (§16.3), so an absent mirror is a route
    # that does not exist yet rather than a UI that does not work.
    # Never for a fork. §9.1 derives "T2 may run on the storage node" from fork PRs
    # not existing, which was true only while the repository was private. It is
    # public, so a fork's pull request would otherwise schedule that fork's code
    # on a node holding the registry, the object store and every devcontainer.
    #
    # This is a guard, not the fix. §9.1's precondition does not hold and the
    # specification says so (§21.10): either the repository goes private again,
    # or T2 moves to hosted runners.
    if: >-
      vars.CLUSTER_FLEET_ONLINE == 'true'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, cluster, ci]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: bundle
      - name: Install the bundle where the control plane serves it
        run: |
          set -euo pipefail
          tar -xf bundle/artifact.tar -C bundle
          rm -f bundle/artifact.tar
          sudo install -d -m 0755 /var/lib/cluster-ctl/web
          sudo rsync --archive --delete bundle/ /var/lib/cluster-ctl/web/
          sudo restorecon -R /var/lib/cluster-ctl/web
