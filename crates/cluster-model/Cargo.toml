[package]
name = "cluster-model"
description = "The typed cluster model and the renderers that make R1 cover every infrastructure artifact (SPEC.md §7)."
# Build-time and CI infrastructure. The renderers run under `just render` and
# `cargo xtask check-render`; nothing on a node parses the model at runtime.
# What a node reads is the *rendered* tree, shipped inside its image, which is
# the same grain bootc uses for everything else.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
repo-model = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Parsing the rendered JSON in CD-16. A dev dependency: nothing this crate
# ships reads JSON, and the renderers emit it as text.
serde_json = { workspace = true }

[lints]
workspace = true
