# bootc-image-builder configuration (SPEC.md §12.1).
#
# Produces the installer ISO a node is first provisioned from. The ISO's SHA-256
# is published in the release and verified out of band, and **that checksum is
# the root of trust**: §12.3's signature policy ships inside the image, so the
# first install cannot verify itself and is anchored by the checksum instead.
#
# The kickstart is rendered from the model into generated/bootstrap/<node>.ks and
# is diff-gated (§7.2, CD-07). This file only says how to wrap it.

[customizations.installer.kickstart]
# This file is a template, and the placeholder below is filled by
# `cargo xtask installer-config`, which writes the configuration the builder is
# actually given. The template is never handed to the builder itself.
#
# The kickstart is not inlined here because it is rendered from the model and
# diff-gated (§7.2, CD-07): a copy of it in this file would be a second source
# for the disk layout.
#
# **No secret is substituted here, and none ever was supplied.** These carried
# three `@@SECRET@@` names once, filled from Actions secrets that did not exist
# --- and the design was wrong even had they existed, because an ISO is a
# release artifact and a secret put in one is published to whoever downloads it.
# A node installs unenrolled and is given its credentials through the browser
# after it boots (§12.2).
#
# A multi-line basic string, because a kickstart has newlines and a
# single-quoted TOML string cannot hold one. That shipped once: the
# substitution produced a configuration the builder would have refused, at ISO
# build time and nowhere earlier. `installer-config` now parses what it wrote
# and compares it against what it substituted, so the escaping is checked
# rather than believed.
contents = """
@@RENDERED_KICKSTART@@
"""

[customizations.installer.modules]
# Everything the installer does is in the kickstart. An interactive module would
# be a prompt on a headless node that nobody is standing in front of.
disable = ["org.fedoraproject.Anaconda.Modules.Users"]

[[customizations.filesystem]]
mountpoint = "/"
minsize = "20 GiB"
